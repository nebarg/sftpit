# Added to examples/compose/docker-compose.yml by check.sh: a stand-in for an
# application, which runs client.sh with curl, whose SFTP is libssh2's.
# Paths are relative to examples/compose.
services:
  client:
    image: 'curlimages/curl:8.11.1'
    depends_on:
      - sftpit
    entrypoint: ['/bin/sh', '/check/client.sh']
    volumes:
      - '../../test/container:/check:ro'
