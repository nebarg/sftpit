name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The latest patch release, so that govulncheck judges a fixed
          # standard library rather than go.mod's minimum.
          go-version: "1.26.x"
          check-latest: true
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: gmp, mbstring
          tools: composer
      # For the dashboard's tests, which use only Node's own test runner.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # The conformance tests compare with OpenSSH's sftp-server on Linux.
      - name: Install OpenSSH's sftp-server
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openssh-sftp-server
      - run: make integration-deps
      - run: make check
      - run: make vuln
        if: runner.os == 'Linux'

  # The image in the Sail-shaped compose example, with a stand-in application.
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          tools: composer
      - run: make integration-deps
      - run: make container-check
